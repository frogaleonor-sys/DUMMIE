<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >

    <title>UNKNOWN ENTITY</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <div class="app">

        <!-- TOP BAR -->

        <header class="top-bar">

            <div class="system-name">
                UNKNOWN ENTITY
            </div>

            <div class="status">
                <span class="status-dot"></span>
                ONLINE
            </div>

        </header>


        <!-- MAIN AREA -->

        <main class="main">

            <!-- ENTITY DISPLAY -->

            <section class="entity-section">

                <div class="entity-container">

                    <div
                        id="entity"
                        class="entity"
                    >
                        ◉_◉
                    </div>

                </div>


                <div class="entity-name">
                    ENTITY_001
                </div>

                <div
                    id="mood"
                    class="mood"
                >
                    MOOD: CONFUSED
                </div>

            </section>


            <!-- CONVERSATION -->

            <section class="conversation">

                <div
                    id="messages"
                    class="messages"
                >

                    <div class="message entity-message">

                        <span class="message-label">
                            ENTITY
                        </span>

                        <p>
                            Where... am I?
                        </p>

                    </div>

                </div>


                <!-- INPUT -->

                <div class="input-area">

                    <input
                        id="userInput"
                        type="text"
                        placeholder="Talk to the entity..."
                        autocomplete="off"
                    >

                    <button
                        id="sendButton"
                        type="button"
                    >
                        SEND
                    </button>

                </div>

            </section>


            <!-- STATS -->

            <section class="stats">

                <div class="stat">

                    <span>
                        MEMORY
                    </span>

                    <strong id="memory">
                        0%
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        TRUST
                    </span>

                    <strong id="trust">
                        0%
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        UNDERSTANDING
                    </span>

                    <strong id="understanding">
                        1%
                    </strong>

                </div>

            </section>

        </main>


        <!-- BOTTOM BAR -->

        <footer class="bottom-bar">

            <span>
                ENTITY STATUS
            </span>

            <span id="growth">
                DEVELOPMENT: 0
            </span>

        </footer>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
