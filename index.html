```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#06111f"
    >

    <title>DUMMIE // AI HUD</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

    <!-- =========================================
         TOP SYSTEM BAR
         ========================================= -->

    <header class="top-bar">

        <div class="brand">
            <span class="brand-mark">◈</span>
            <span>DUMMIE</span>
        </div>

        <div class="system-status">

            <span
                id="status-dot"
                class="status-dot"
            ></span>

            <span id="system-status">
                SYSTEM ONLINE
            </span>

        </div>

    </header>


    <!-- =========================================
         MAIN HUD
         ========================================= -->

    <main class="hud">

        <!-- Left / Top information -->

        <section class="hud-panel panel-left">

            <div class="panel-title">
                SYSTEM
            </div>

            <div class="data-row">
                <span>CORE</span>
                <strong>ONLINE</strong>
            </div>

            <div class="data-row">
                <span>AI STATUS</span>
                <strong id="ai-status">
                    READY
                </strong>
            </div>

            <div class="data-row">
                <span>VOICE</span>
                <strong>
                    ACTIVE
                </strong>
            </div>

            <div class="data-row">
                <span>NETWORK</span>
                <strong>
                    LOCAL
                </strong>
            </div>

        </section>


        <!-- Right information -->

        <section class="hud-panel panel-right">

            <div class="panel-title">
                TELEMETRY
            </div>

            <div class="data-row">
                <span>TIME</span>

                <strong id="hud-time">
                    --:--
                </strong>
            </div>

            <div class="data-row">
                <span>DATE</span>

                <strong id="hud-date">
                    ----
                </strong>
            </div>

            <div class="data-row">
                <span>MODE</span>

                <strong>
                    PERSONAL
                </strong>
            </div>

        </section>


        <!-- =====================================
             CENTRAL AI CORE
             ===================================== -->

        <section class="core-area">

            <div class="core-ring ring-one"></div>

            <div class="core-ring ring-two"></div>

            <div class="core-ring ring-three"></div>

            <div class="core-core">

                <div class="core-symbol">
                    ◈
                </div>

                <div class="core-label">
                    DUMMIE
                </div>

                <div
                    id="core-state"
                    class="core-state"
                >
                    READY
                </div>

            </div>

        </section>


        <!-- =====================================
             RESPONSE
             ===================================== -->

        <section
            id="speech-bubble"
            class="speech-bubble"
        >

            <div
                id="speech-name"
                class="speech-name"
            >
                DUMMIE
            </div>

            <div
                id="speech-text"
                class="speech-text"
            >
                Systems online.
                Hello, Creator.
            </div>

        </section>


        <!-- =====================================
             DECORATIVE HUD ELEMENTS
             ===================================== -->

        <div class="scan-line"></div>

        <div class="crosshair top-left">
            +
        </div>

        <div class="crosshair top-right">
            +
        </div>

        <div class="crosshair bottom-left">
            +
        </div>

        <div class="crosshair bottom-right">
            +
        </div>


        <!-- =====================================
             COMMAND AREA
             ===================================== -->

        <section class="command-area">

            <div class="command-label">
                COMMAND INTERFACE
            </div>

            <div class="command-row">

                <button
                    id="mic-button"
                    class="mic-button"
                    aria-label="Voice command"
                >
                    🎙
                </button>

                <input
                    id="text-input"
                    type="text"
                    autocomplete="off"
                    placeholder="Speak or type a command..."
                >

                <button
                    id="send-button"
                    class="send-button"
                    aria-label="Send command"
                >
                    ➤
                </button>

            </div>

        </section>


        <!-- =====================================
             BOTTOM DATA
             ===================================== -->

        <section class="bottom-data">

            <span>
                DUMMIE CORE v0.2
            </span>

            <span>
                AI ASSISTANT PROTOTYPE
            </span>

            <span>
                <span class="tiny-dot"></span>
                OPERATIONAL
            </span>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
```
