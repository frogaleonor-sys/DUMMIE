<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>ABM 2 HUB</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div>

            <div class="school-name">
                ABM 2
            </div>

            <div class="hub-name">
                STUDY HUB
            </div>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            ONLINE

        </div>

    </header>



    <!-- MAIN -->

    <main>


        <!-- WELCOME -->

        <section class="welcome">

            <p class="small-label">
                WELCOME BACK
            </p>

            <h1>
                ABM 2 HUB
            </h1>

            <p>
                Everything important for our section,
                in one place.
            </p>

        </section>



        <!-- QUICK INFO -->

        <section class="quick-grid">


            <button
                class="quick-card"
                data-page="schedule"
                type="button"
            >

                <span class="icon">
                    📅
                </span>

                <span>
                    SCHEDULE
                </span>

            </button>


            <button
                class="quick-card"
                data-page="activities"
                type="button"
            >

                <span class="icon">
                    📚
                </span>

                <span>
                    ACTIVITIES
                </span>

            </button>


            <button
                class="quick-card"
                data-page="deadlines"
                type="button"
            >

                <span class="icon">
                    ⏰
                </span>

                <span>
                    DEADLINES
                </span>

            </button>


            <button
                class="quick-card"
                data-page="announcements"
                type="button"
            >

                <span class="icon">
                    📢
                </span>

                <span>
                    ANNOUNCEMENTS
                </span>

            </button>


        </section>



        <!-- NEXT DEADLINE -->

        <section class="panel">

            <div class="panel-header">

                <span>
                    NEXT DEADLINE
                </span>

                <span class="badge">
                    UPCOMING
                </span>

            </div>


            <div class="deadline">

                <div>

                    <h2 id="deadline-name">
                        No deadline added
                    </h2>

                    <p id="deadline-subject">
                        —
                    </p>

                </div>


                <div class="date">

                    <strong id="deadline-date">
                        —
                    </strong>

                </div>

            </div>

        </section>



        <!-- ANNOUNCEMENTS -->

        <section class="panel">

            <div class="panel-header">

                <span>
                    LATEST ANNOUNCEMENT
                </span>

            </div>


            <div class="announcement">

                <div class="announcement-icon">
                    📢
                </div>

                <div>

                    <h2 id="announcement-title">
                        No announcements
                    </h2>

                    <p id="announcement-text">
                        Check back later for updates.
                    </p>

                </div>

            </div>

        </section>



        <!-- TODAY -->

        <section class="panel">

            <div class="panel-header">

                <span>
                    TODAY'S CLASSES
                </span>

            </div>


            <div
                id="today-classes"
                class="class-list"
            >

                <div class="empty">

                    No classes added yet.

                </div>

            </div>

        </section>


    </main>



    <!-- NAVIGATION -->

    <nav class="navigation">

        <button
            class="nav-button active"
            data-page="home"
            type="button"
        >

            🏠

            <span>
                HOME
            </span>

        </button>


        <button
            class="nav-button"
            data-page="schedule"
            type="button"
        >

            📅

            <span>
                SCHEDULE
            </span>

        </button>


        <button
            class="nav-button"
            data-page="activities"
            type="button"
        >

            📚

            <span>
                ACTIVITIES
            </span>

        </button>


        <button
            class="nav-button"
            data-page="more"
            type="button"
        >

            ☰

            <span>
                MORE
            </span>

        </button>

    </nav>


</div>



<script src="script.js"></script>

</body>

</html>
