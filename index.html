<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#02070d"
    >

    <title>ECHO-01</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div id="app">


    <!-- TOP BAR -->

    <header>

        <div>

            <span class="signal-dot"></span>

            ECHO-01

        </div>


        <div id="connection">

            SIGNAL ONLINE

        </div>

    </header>



    <!-- MAIN HUD -->

    <main>


        <!-- WORLD MAP -->

        <section class="map-section">

            <div class="map-title">

                PLANETARY SURVEILLANCE

            </div>


            <div id="map">


                <!-- CITY -->

                <div
                    class="location city"
                    data-name="Veyra City"
                >

                    ●

                    <span>
                        VEYRA
                    </span>

                </div>


                <!-- RUINS -->

                <div
                    class="location ruins"
                    data-name="Unknown Ruins"
                >

                    ●

                    <span>
                        RUINS
                    </span>

                </div>


                <!-- SIGNAL -->

                <div
                    class="location signal"
                    data-name="Unknown Signal"
                >

                    ●

                    <span>
                        SIGNAL
                    </span>

                </div>


            </div>

        </section>



        <!-- INFORMATION -->

        <section class="information">


            <!-- SATELLITE STATUS -->

            <div class="panel">

                <div class="panel-title">

                    SATELLITE STATUS

                </div>


                <p>

                    SYSTEM

                    <strong>
                        ONLINE
                    </strong>

                </p>


                <p>

                    ORBIT

                    <strong>
                        STABLE
                    </strong>

                </p>


                <p>

                    SIGNAL

                    <strong id="signal">
                        72%
                    </strong>

                </p>


                <p>

                    ENERGY

                    <strong>
                        91%
                    </strong>

                </p>

            </div>



            <!-- EVENT PANEL -->

            <div
                id="event"
                class="panel event"
            >

                <div class="panel-title">

                    SYSTEM MESSAGE

                </div>


                <p>

                    No anomalies detected.

                </p>

            </div>


        </section>


    </main>



    <!-- NAVIGATION -->

    <nav>


        <button
            class="active"
            data-page="world"
            type="button"
        >

            🌍

            <span>
                WORLD
            </span>

        </button>



        <button
            data-page="signals"
            type="button"
        >

            📡

            <span>
                SIGNALS
            </span>

        </button>



        <button
            data-page="entity"
            type="button"
        >

            🤖

            <span>
                ENTITY
            </span>

        </button>



        <button
            data-page="archive"
            type="button"
        >

            📁

            <span>
                ARCHIVE
            </span>

        </button>


    </nav>


</div>



<!-- JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>
