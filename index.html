<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ECHO-01</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div id="app">

        <header>

            <div>
                <span class="signal-dot"></span>
                ECHO-01
            </div>

            <div id="connection">
                SIGNAL ONLINE
            </div>

        </header>


        <main>

            <section class="map-section">

                <div class="map-title">
                    PLANETARY SURVEILLANCE
                </div>

                <div id="map">

                    <div
                        class="location city"
                        data-name="Veyra City"
                    >
                        ●
                        <span>VEYRA</span>
                    </div>

                    <div
                        class="location ruins"
                        data-name="Unknown Ruins"
                    >
                        ●
                        <span>RUINS</span>
                    </div>

                    <div
                        class="location signal"
                        data-name="Unknown Signal"
                    >
                        ●
                        <span>SIGNAL</span>
                    </div>

                </div>

            </section>


            <section class="information">

                <div class="panel">

                    <div class="panel-title">
                        SATELLITE STATUS
                    </div>

                    <p>
                        SYSTEM
                        <strong>ONLINE</strong>
                    </p>

                    <p>
                        ORBIT
                        <strong>STABLE</strong>
                    </p>

                    <p>
                        SIGNAL
                        <strong id="signal">
                            72%
                        </strong>
                    </p>

                    <p>
                        ENERGY
                        <strong>
                            91%
                        </strong>
                    </p>

                </div>


                <div
                    id="event"
                    class="panel event"
                >

                    <div class="panel-title">
                        SYSTEM MESSAGE
                    </div>

                    <p>
                        No anomalies detected.
                    </p>

                </div>

            </section>

        </main>


        <nav>

            <button
                class="active"
                data-page="world"
            >
                🌍
                <span>WORLD</span>
            </button>

            <button
                data-page="signals"
            >
                📡
                <span>SIGNALS</span>
            </button>

            <button
                data-page="entity"
            >
                🤖
                <span>ENTITY</span>
            </button>

            <button
                data-page="archive"
            >
                📁
                <span>ARCHIVE</span>
            </button>

        </nav>

    </div>


    <script>

const locations =
    document.querySelectorAll(".location");

const eventBox =
    document.getElementById("event");

const signal =
    document.getElementById("signal");


locations.forEach(location => {

    location.addEventListener("click", () => {

        const name =
            location.dataset.name;

        eventBox.innerHTML = `
            <div class="panel-title">
                LOCATION DETECTED
            </div>

            <p>
                TARGET
                <strong>${name}</strong>
            </p>

            <p>
                STATUS
                <strong>SCANNING</strong>
            </p>
        `;

        signal.textContent =
            Math.floor(
                Math.random() * 30 + 65
            ) + "%";

    });

});


document
    .querySelectorAll("nav button")
    .forEach(button => {

        button.addEventListener("click", () => {

            document
                .querySelectorAll("nav button")
                .forEach(b =>
                    b.classList.remove("active")
                );

            button.classList.add("active");

            const page =
                button.dataset.page;


            if (page === "signals") {

                eventBox.innerHTML = `
                    <div class="panel-title">
                        SIGNAL NETWORK
                    </div>

                    <p>
                        UNKNOWN SIGNAL
                        <strong>DETECTED</strong>
                    </p>
                `;

            }


            if (page === "entity") {

                eventBox.innerHTML = `
                    <div class="panel-title">
                        ENTITY DATABASE
                    </div>

                    <p>
                        KNOWN ENTITIES
                        <strong>0</strong>
                    </p>
                `;

            }


            if (page === "archive") {

                eventBox.innerHTML = `
                    <div class="panel-title">
                        ARCHIVE
                    </div>

                    <p>
                        DISCOVERIES
                        <strong>0</strong>
                    </p>
                `;

            }


            if (page === "world") {

                eventBox.innerHTML = `
                    <div class="panel-title">
                        SYSTEM MESSAGE
                    </div>

                    <p>
                        No anomalies detected.
                    </p>
                `;

            }

        });

    });

    </script>
